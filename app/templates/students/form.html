{% extends "layouts/base.html" %}

{% block title %}{{ "Sửa" if student else "Thêm" }} học sinh | HSMS Web{% endblock %}

{% block content %}
{% include "components/flash.html" %}
<section class="page-header mb-3"><h1 class="h2 mb-0">{{ "Sửa" if student else "Thêm" }} học sinh</h1></section>
<form class="content-panel form-grid" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Mã học sinh<input class="form-control" name="code" value="{{ student.code if student else '' }}" required></label>
  <label>Họ tên<input class="form-control" name="full_name" value="{{ student.full_name if student else '' }}" required></label>
  <label>Giới tính<select class="form-select" name="gender"><option value="">Chọn</option><option value="1" {% if student and student.gender == 1 %}selected{% endif %}>Nam</option><option value="0" {% if student and student.gender == 0 %}selected{% endif %}>Nữ</option></select></label>
  <label>Lớp<select class="form-select" name="class_id"><option value="">Chưa phân lớp</option>{% for item in classes %}<option value="{{ item.id }}" {% if student and student.class_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <label>Điểm TB<input class="form-control" name="average_score" value="{{ student.average_score if student and student.average_score is not none else '' }}"></label>
  <label>Trạng thái<input class="form-control" name="learning_status" value="{{ student.learning_status if student else 'Đang học' }}"></label>
  <label class="span-2">Địa chỉ<input class="form-control" name="address" value="{{ student.address if student and student.address else '' }}"></label>
  <div class="span-2 d-flex gap-2"><button class="btn btn-primary" type="submit">Lưu</button><a class="btn btn-outline-secondary" href="{{ url_for('students.index') }}">Hủy</a></div>
</form>
{% endblock %}
