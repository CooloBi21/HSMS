[database]
; BTTH05: thay doi thong tin ket noi CSDL tai day, khong can sua code.
; provider ho tro truc tiep: sqlite
; provider qua driver ngoai: odbc, sqlserver, access, oracle
provider = sqlite
connection_string = data/hsms.db

; Vi du SQL Server neu moi truong da cai ODBC Driver va pyodbc:
; provider = sqlserver
; connection_string = Driver={ODBC Driver 18 for SQL Server};Server=localhost;Database=HSMS;Trusted_Connection=yes;TrustServerCertificate=yes;

; Vi du Access neu moi truong da cai Microsoft Access Database Engine va pyodbc:
; provider = access
; connection_string = Driver={Microsoft Access Driver (*.mdb, *.accdb)};DBQ=D:\VisualStudioCode\Projects\HSMS\data\hsms.accdb;

; Vi du Oracle neu moi truong da cai Oracle ODBC Driver va pyodbc:
; provider = oracle
; connection_string = Driver={Oracle in OraClient19Home1};Dbq=localhost:1521/XEPDB1;Uid=hsms;Pwd=your_password;
